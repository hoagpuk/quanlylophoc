<script>
'use strict';
/* ===================== 1. DATA MODEL & STORAGE ===================== */
const $=s=>document.querySelector(s);
const TABLES=['students','parents','studentParents','classes','enrollments','studentFeeContracts','studentFeePeriods','studentSchedules','teachers','teacherAssignments','teacherSalaryContracts','teacherSchedules','teachingSessions','attendance','invoices','invoiceItems','payments','paymentAllocations','customerCredits','refunds','payrolls','payrollItems','teacherAdvances','bonuses','deductions','teacherPayments','expenseCategories','expenses','accounts','ledgerTransactions','academicPeriods','adjustments','users','roles','permissions','settings','auditLogs'];
const ROLES={ADMIN:'*',MANAGER:'fin,approve,report,data,edit,att',ACCOUNTANT:'fin,report',STAFF:'edit,att',TEACHER:'att'};
let DB,ME={role:'ADMIN',id:'USR-000001'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),curP=()=>today().slice(0,7);
const D=s=>new Date(s+'T00:00:00'),addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d)};
const wd=d=>d.getDay()===0?8:d.getDay()+1; // 2..7 = Thứ 2..7, 8 = CN
const money=n=>Math.round(n||0).toLocaleString('vi-VN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Store={key:'qltt_v1',
 blank(){const d={};TABLES.forEach(t=>d[t]=[]);d.settings=[{seq:{}}];
  d.accounts=[{account_id:'CASH',name:'Tiền mặt',opening:0},{account_id:'BANK_A',name:'Ngân hàng A',opening:0}];
  d.users=[{user_id:'USR-000001',name:'Quản trị',role:'ADMIN'}];
  d.expenseCategories=['TEACHER_SALARY','RENT','ELECTRICITY','WATER','INTERNET','EQUIPMENT','FURNITURE','COMPUTER','STATIONERY','MARKETING','REPAIR','TRANSPORT','OTHER'].map(c=>({category_id:c,name:c}));return d},
 load(){DB=null;try{DB=JSON.parse(localStorage.getItem(this.key))}catch(e){}if(!DB)DB=this.blank();TABLES.forEach(t=>DB[t]=DB[t]||[]);if(!DB.settings[0])DB.settings=[{seq:{}}]},
 save(){localStorage.setItem(this.key,JSON.stringify(DB))}};
const nid=p=>{const s=DB.settings[0].seq;s[p]=(s[p]||0)+1;return p+'-'+pad(s[p]).padStart(6,'0')};
const audit=(action,entity,id,o,n,reason)=>DB.auditLogs.push({user_id:ME.id,action,entity,entity_id:id,old_value:o??null,new_value:n??null,timestamp:new Date().toISOString(),reason:reason||''});
const can=p=>{const r=ROLES[ME.role];return r==='*'||r.split(',').includes(p)};
const need=p=>{if(!can(p))throw Error('Vai trò '+ME.role+' không có quyền "'+p+'"')};
const closed=p=>DB.academicPeriods.some(x=>x.period===p&&x.status==='CLOSED');
const by=(t,k,v)=>DB[t].find(x=>x[k]===v);
const sName=id=>by('students','student_id',id)?.full_name||id, tName=id=>by('teachers','teacher_id',id)?.full_name||id, cName=id=>by('classes','class_id',id)?.class_name||id;

/* ===================== 2. VALIDATION ===================== */
const V={
 pos(n,l){if(!(n>0))throw Error(l+' phải lớn hơn 0')},
 req(v,l){if(v===''||v==null)throw Error('Thiếu '+l)},
 time(a,b){if(!a||!b||a>=b)throw Error('Giờ bắt đầu phải trước giờ kết thúc')},
 days(s){const a=String(s).split(/[ ,]+/).filter(Boolean).map(Number);if(!a.length||a.some(x=>x<2||x>8))throw Error('Thứ phải là 2-7 hoặc 8 (Chủ nhật)');return a},
 noOverlap(list,from,to,l){list.forEach(c=>{const a=c.effective_from,b=c.effective_to||'9999';if(from<=b&&(to||'9999')>=a)throw Error(l+' bị chồng thời gian')})}
};

/* ===================== 3. BUSINESS LOGIC ===================== */
const BL={
 net:i=>i.gross_amount-i.discount_amount-i.scholarship_amount+i.adjustment_amount,
 activePay:()=>new Set(DB.payments.filter(p=>p.status==='ACTIVE').map(p=>p.payment_id)),
 allocOf(inv){const a=this.activePay();return DB.paymentAllocations.filter(x=>x.invoice_id===inv.invoice_id&&a.has(x.payment_id)).reduce((s,x)=>s+x.amount,0)},
 calculateInvoiceBalance(inv){return['CANCELLED','WAIVED'].includes(inv.status)?0:Math.max(0,this.net(inv)-this.allocOf(inv))},
 chargeable(sid,eid,p){const e=by('enrollments','enrollment_id',eid);return DB.attendance.filter(a=>{if(a.student_id!==sid||!a.chargeable)return false;const s=by('teachingSessions','session_id',a.session_id);return s&&s.date.startsWith(p)&&s.class_id===e?.class_id}).length},
 calculateStudentFee(c,p){
  const [y,m]=p.split('-').map(Number),dim=new Date(y,m,0).getDate();let g=0,desc='Học phí tháng';
  if(c.billing_type==='PER_SESSION'){const n=this.chargeable(c.student_id,c.enrollment_id,p);g=n*c.price_per_session;desc=n+' buổi × '+money(c.price_per_session)}
  else if(c.billing_type==='COURSE'){g=p===c.effective_from.slice(0,7)?c.gross_amount:0;desc='Trọn khóa'}
  else{g=c.gross_amount;
   const first=p===c.effective_from.slice(0,7),last=c.effective_to&&p===c.effective_to.slice(0,7);
   if((first&&+c.effective_from.slice(8)>1)||(last&&+c.effective_to.slice(8)<dim)){
    const s=first?+c.effective_from.slice(8):1,e=last?+c.effective_to.slice(8):dim,pol=c.partial_policy||'FULL_MONTH';
    if(pol==='PRORATED'){g=Math.round(g*(e-s+1)/dim);desc='Theo ngày '+(e-s+1)+'/'+dim}
    else if(pol==='PER_SESSION'){const n=this.chargeable(c.student_id,c.enrollment_id,p);g=n*c.price_per_session;desc=n+' buổi (tháng lẻ)'}
    else if(pol==='CUSTOM'){g=c.custom_amount||0;desc='Tháng lẻ - tùy chỉnh'}}}
  let d=0,sc=0;const v=c.discount_value||0;
  if(c.discount_type==='DISCOUNT_PERCENT')d=Math.round(g*v/100);else if(c.discount_type==='DISCOUNT_FIXED'||c.discount_type==='PROMOTION')d=v;else if(c.discount_type==='SCHOLARSHIP')sc=v;
  d=Math.min(d,g);sc=Math.min(sc,g-d);return{gross:g,discount:d,scholarship:sc,desc}},
 dueDate(c,p){const [y,m]=p.split('-').map(Number),dim=new Date(y,m,0).getDate();
  if(c.due_rule==='END_OF_MONTH')return p+'-'+pad(dim);
  if(c.due_rule==='FIXED_DAY')return p+'-'+pad(Math.min(c.due_day||5,dim));
  if(c.due_rule==='AFTER_SESSIONS'){const ds=DB.attendance.filter(a=>a.student_id===c.student_id).map(a=>by('teachingSessions','session_id',a.session_id)).filter(s=>s&&s.date.startsWith(p)).map(s=>s.date).sort();return ds[(c.due_after_sessions||4)-1]||p+'-'+pad(dim)}
  return addDays(p+'-01',c.due_day||0)},
 generateInvoices(){let n=0;const cp=curP();
  DB.studentFeeContracts.filter(c=>c.status==='ACTIVE').forEach(c=>{
   const st=by('students','student_id',c.student_id);if(!st||st.status==='TRIAL')return;
   let p=c.effective_from.slice(0,7);const end=(c.effective_to&&c.effective_to.slice(0,7)<cp)?c.effective_to.slice(0,7):cp;
   for(;p<=end;p=this.nextP(p)){
    if(closed(p))continue;const f=this.calculateStudentFee(c,p);
    let inv=DB.invoices.find(i=>i.fee_contract_id===c.fee_contract_id&&i.billing_period===p&&i.status!=='CANCELLED');
    if(!inv){if(f.gross<=0)continue;
     inv={invoice_id:nid('INV'),invoice_number:'HD'+p.replace('-','')+'-'+pad(DB.settings[0].seq.INVN=(DB.settings[0].seq.INVN||DB.invoices.length)+1).padStart(4,'0'),student_id:c.student_id,enrollment_id:c.enrollment_id,fee_contract_id:c.fee_contract_id,billing_period:p,issue_date:today(),due_date:'',gross_amount:0,discount_amount:0,scholarship_amount:0,adjustment_amount:0,net_amount:0,status:'UNPAID'};
     DB.invoices.push(inv);n++;audit('CREATE','invoice',inv.invoice_id,null,{p,gross:f.gross},'Tự động từ hợp đồng')}
    inv.gross_amount=f.gross;inv.discount_amount=f.discount;inv.scholarship_amount=f.scholarship;inv.due_date=this.dueDate(c,p);
    inv.adjustment_amount=DB.adjustments.filter(a=>a.invoice_id===inv.invoice_id&&a.status==='APPROVED').reduce((s,a)=>s+a.amount,0);
    inv.net_amount=this.net(inv);
    let it=DB.invoiceItems.find(x=>x.invoice_id===inv.invoice_id);if(!it)DB.invoiceItems.push(it={item_id:nid('ITM'),invoice_id:inv.invoice_id});it.description=f.desc;it.amount=f.gross;
    let fp=DB.studentFeePeriods.find(x=>x.student_id===c.student_id&&x.enrollment_id===c.enrollment_id&&x.period===p);
    if(!fp)DB.studentFeePeriods.push(fp={student_fee_period_id:nid('SFP'),student_id:c.student_id,enrollment_id:c.enrollment_id,period:p});
    Object.assign(fp,{gross_amount:f.gross,discount_amount:f.discount+f.scholarship,adjustment_amount:inv.adjustment_amount,net_amount:inv.net_amount,due_date:inv.due_date})}});
  return n},
 nextP(p){let [y,m]=p.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+pad(m)},
 autoAllocate(){ // Nợ cũ nhất trước; phần dư = credit
  const pay=DB.payments.filter(p=>p.status==='ACTIVE').sort((a,b)=>a.payment_date.localeCompare(b.payment_date));
  pay.forEach(p=>{let rem=this.paymentRemain(p);if(rem<=0)return;
   DB.invoices.filter(i=>i.student_id===p.student_id&&this.calculateInvoiceBalance(i)>0).sort((a,b)=>a.due_date.localeCompare(b.due_date)||a.billing_period.localeCompare(b.billing_period)).forEach(i=>{
    const b=this.calculateInvoiceBalance(i),a=Math.min(rem,b);if(a>0){DB.paymentAllocations.push({allocation_id:nid('ALC'),payment_id:p.payment_id,invoice_id:i.invoice_id,amount:a,auto:true});rem-=a}})})},
 paymentRemain(p){return p.total_amount-DB.paymentAllocations.filter(a=>a.payment_id===p.payment_id).reduce((s,a)=>s+a.amount,0)-DB.refunds.filter(r=>r.payment_id===p.payment_id).reduce((s,r)=>s+r.amount,0)},
 calculateStudentCredit(sid){return DB.payments.filter(p=>p.student_id===sid&&p.status==='ACTIVE').reduce((s,p)=>s+this.paymentRemain(p),0)},
 updateStatuses(){const t=today();DB.invoices.forEach(i=>{if(['CANCELLED','WAIVED'].includes(i.status))return;
  const net=this.net(i),paid=this.allocOf(i);i.net_amount=net;
  i.status=net<=0||paid>=net?'PAID':(i.due_date<t?'OVERDUE':(paid>0?'PARTIAL':'UNPAID'));i.paid=paid})},
 calculateStudentDebt(sid){const iv=DB.invoices.filter(i=>i.student_id===sid&&!['CANCELLED','WAIVED'].includes(i.status));
  const due=iv.reduce((s,i)=>s+this.net(i),0),paid=iv.reduce((s,i)=>s+this.allocOf(i),0),open=iv.filter(i=>this.calculateInvoiceBalance(i)>0).sort((a,b)=>a.due_date.localeCompare(b.due_date));
  const od=open.find(i=>i.due_date<today());
  return{due,paid,debt:due-paid,months:open.length,oldest:open[0]?.billing_period||'',overdueDays:od?Math.floor((D(today())-D(od.due_date))/864e5):0,credit:this.calculateStudentCredit(sid),thisMonth:iv.find(i=>i.billing_period===curP())}},
 addPayment(v){need('fin');V.pos(v.total_amount,'Số tiền');V.req(v.student_id,'học sinh');
  if(closed(v.payment_date.slice(0,7)))throw Error('Kỳ '+v.payment_date.slice(0,7)+' đã khóa, hãy dùng điều chỉnh');
  const p={payment_id:nid('PAY'),receipt_number:'PT'+String(DB.settings[0].seq.RCP=(DB.settings[0].seq.RCP||0)+1).padStart(6,'0'),student_id:v.student_id,payment_date:v.payment_date,total_amount:v.total_amount,payment_method:v.payment_method,account_id:v.account_id,received_by:ME.id,status:'ACTIVE',note:v.note};
  DB.payments.push(p);
  if(v.invoice_id!=='AUTO'){const i=by('invoices','invoice_id',v.invoice_id);if(!i||i.student_id!==v.student_id)throw Error('Hóa đơn không thuộc học sinh này');
   const a=Math.min(p.total_amount,this.calculateInvoiceBalance(i));if(a>0)DB.paymentAllocations.push({allocation_id:nid('ALC'),payment_id:p.payment_id,invoice_id:i.invoice_id,amount:a,auto:false})}
  DB.ledgerTransactions.push({txn_id:nid('TXN'),date:p.payment_date,type:'TUITION_IN',account_id:p.account_id,amount:p.total_amount,ref_type:'payment',ref_id:p.payment_id,status:'ACTIVE'});
  audit('PAYMENT','payment',p.payment_id,null,p,'Thu học phí')},
 voidPayment(id,reason){need('fin');const p=by('payments','payment_id',id);if(!p||p.status==='VOID')return;
  if(closed(p.payment_date.slice(0,7)))throw Error('Kỳ đã khóa, không thể void');
  audit('VOID','payment',id,p.status,'VOID',reason);p.status='VOID';DB.ledgerTransactions.filter(t=>t.ref_id===id).forEach(t=>t.status='VOID');
  DB.paymentAllocations=DB.paymentAllocations.filter(a=>a.payment_id!==id)},
 calculateTeacherSessions(tid,p){return DB.teachingSessions.filter(s=>s.actual_teacher_id===tid&&s.date.startsWith(p)&&this.paid(s)>0)},
 paid(s){if(['COMPLETED','MAKEUP'].includes(s.status))return 1;if(['CANCELLED','POSTPONED'].includes(s.status))return s.pay_policy==='FULL_PAY'?1:s.pay_policy==='PARTIAL_PAY'?.5:0;return 0},
 rateFor(tid,cid,date){const as=DB.teacherAssignments.filter(a=>a.teacher_id===tid&&a.class_id===cid).map(a=>a.assignment_id);
  return DB.teacherSalaryContracts.find(c=>c.status==='ACTIVE'&&c.teacher_id===tid&&as.includes(c.assignment_id)&&c.effective_from<=date&&(!c.effective_to||c.effective_to>=date))},
 calculateTeacherPayroll(){ // tự tạo/cập nhật payroll cho mọi kỳ chưa khóa
  const keys=new Set();DB.teachingSessions.forEach(s=>{if(this.paid(s)>0)keys.add(s.actual_teacher_id+'|'+s.date.slice(0,7))});
  [...DB.bonuses,...DB.deductions,...DB.teacherAdvances].forEach(x=>keys.add(x.teacher_id+'|'+x.period));
  DB.teacherSalaryContracts.filter(c=>c.status==='ACTIVE'&&['FIXED_MONTHLY','MIXED'].includes(c.salary_type)).forEach(c=>{if(c.effective_from.slice(0,7)<=curP())keys.add(c.teacher_id+'|'+curP())});
  keys.forEach(k=>{const [tid,p]=k.split('|');if(!by('teachers','teacher_id',tid)||closed(p))return;
   let pr=DB.payrolls.find(x=>x.teacher_id===tid&&x.period===p);
   if(!pr)DB.payrolls.push(pr={payroll_id:nid('PAYROLL'),teacher_id:tid,period:p,status:'UNPAID',approved_by:'',approved_at:''});
   DB.payrollItems=DB.payrollItems.filter(i=>i.payroll_id!==pr.payroll_id);const items=[];
   const bucket={};DB.teachingSessions.filter(s=>s.actual_teacher_id===tid&&s.date.startsWith(p)&&this.paid(s)>0).forEach(s=>{(bucket[s.class_id]=bucket[s.class_id]||[]).push(s)});
   Object.entries(bucket).forEach(([cid,ss])=>ss.forEach(s=>{const c=this.rateFor(tid,cid,s.date);if(!c)return;
    const hrs=(new Date('2000-01-01T'+s.end_time)-new Date('2000-01-01T'+s.start_time))/36e5;
    if(c.salary_type==='PER_HOUR'){items.push({class_id:cid,session_id:s.session_id,rate:c.rate,quantity:hrs*this.paid(s),amount:c.rate*hrs*this.paid(s),note:'Theo giờ'})}
    else if(c.salary_type==='PER_SESSION'||c.salary_type==='MIXED'){items.push({class_id:cid,session_id:s.session_id,rate:c.rate,quantity:this.paid(s),amount:c.rate*this.paid(s),note:'Theo buổi'})}}));
   DB.teacherSalaryContracts.filter(c=>c.teacher_id===tid&&c.status==='ACTIVE'&&c.effective_from.slice(0,7)<=p&&(!c.effective_to||c.effective_to.slice(0,7)>=p)).forEach(c=>{
    const cid=by('teacherAssignments','assignment_id',c.assignment_id)?.class_id;
    if(['FIXED_MONTHLY','MIXED'].includes(c.salary_type)&&c.fixed>0)items.push({class_id:cid,session_id:'',rate:c.fixed,quantity:1,amount:c.fixed,note:'Lương cứng tháng'});
    if(c.salary_type==='PERCENT_REVENUE'){const rev=DB.invoices.filter(i=>i.billing_period===p&&by('enrollments','enrollment_id',i.enrollment_id)?.class_id===cid).reduce((s,i)=>s+this.net(i),0);items.push({class_id:cid,session_id:'',rate:c.rate,quantity:rev,amount:Math.round(rev*c.rate/100),note:c.rate+'% doanh thu'})}});
   items.forEach((i,ix)=>DB.payrollItems.push({payroll_item_id:pr.payroll_id+'-'+String(ix+1).padStart(3,'0'),payroll_id:pr.payroll_id,...i}));
   const sum=a=>a.filter(x=>x.teacher_id===tid&&x.period===p).reduce((s,x)=>s+x.amount,0);
   pr.gross_amount=items.reduce((s,i)=>s+i.amount,0);pr.bonus=sum(DB.bonuses);pr.deduction=sum(DB.deductions);pr.advance=sum(DB.teacherAdvances);
   pr.net_amount=pr.gross_amount+pr.bonus-pr.deduction-pr.advance;
   const paid=this.teacherPaid(pr.payroll_id);pr.status=pr.net_amount>0&&paid>=pr.net_amount?'PAID':paid>0?'PARTIAL':'UNPAID'})},
 teacherPaid:id=>DB.teacherPayments.filter(x=>x.payroll_id===id&&x.status==='ACTIVE').reduce((s,x)=>s+x.amount,0),
 calculateTeacherBalance(pr){return pr.net_amount-this.teacherPaid(pr.payroll_id)},
 payTeacher(v){need('fin');const pr=by('payrolls','payroll_id',v.payroll_id);V.pos(v.amount,'Số tiền');
  if(v.amount>this.calculateTeacherBalance(pr))throw Error('Không được trả vượt số còn phải trả ('+money(this.calculateTeacherBalance(pr))+')');
  const tp={payment_id:nid('TPAY'),payroll_id:pr.payroll_id,teacher_id:pr.teacher_id,amount:v.amount,payment_date:v.payment_date,method:v.method,paid_by:ME.id,note:v.note,status:'ACTIVE',account_id:v.account_id};
  DB.teacherPayments.push(tp);DB.ledgerTransactions.push({txn_id:nid('TXN'),date:tp.payment_date,type:'SALARY_OUT',account_id:v.account_id,amount:-v.amount,ref_type:'teacherPayment',ref_id:tp.payment_id,status:'ACTIVE'});

function recompute(){const a=BL.genSessions(),b=BL.generateInvoices();BL.autoAllocate();BL.updateStatuses();BL.calculateTeacherPayroll();
 const ps=new Set(DB.invoices.map(i=>i.billing_period));ps.add(curP());ps.forEach(p=>{if(!DB.academicPeriods.some(x=>x.period===p))DB.academicPeriods.push({period:p,start_date:p+'-01',end_date:lastDay(p),status:'OPEN'})});
 DB.customerCredits=DB.students.map(s=>({student_id:s.student_id,balance:BL.calculateStudentCredit(s.student_id)})).filter(x=>x.balance>0).map(x=>({credit_id:'CR-'+x.student_id,...x}));return{a,b}}

/* ---------- BUSINESS LOGIC BỔ SUNG ---------- */
BL.chargeable=function(sid,eid,p){const e=by('enrollments','enrollment_id',eid);return DB.attendance.filter(a=>{if(a.student_id!==sid||!a.chargeable)return false;const s=by('teachingSessions','session_id',a.session_id);return s&&['COMPLETED','MAKEUP'].includes(s.status)&&s.date.startsWith(p)&&s.class_id===e?.class_id}).length};
const own=s=>{if(ME.role==='TEACHER'&&s.actual_teacher_id!==ME.teacher_id&&s.scheduled_teacher_id!==ME.teacher_id)throw Error('Chỉ được thao tác buổi dạy của mình')};
const _ss=BL.setSession;BL.setSession=function(id,st,ac,po){own(by('teachingSessions','session_id',id));return _ss.call(this,id,st,ac,po)};
BL.setAttendance=function(id,status){need('att');const a=by('attendance','attendance_id',id),s=by('teachingSessions','session_id',a.session_id);own(s);if(closed(s.date.slice(0,7)))throw Error('Kỳ đã khóa');
 let ch=['PRESENT','MAKEUP'].includes(status)||(status==='ABSENT'&&CFG().absentCharged);
 if(status==='MAKEUP'&&s.original_session_id){const o=DB.attendance.find(x=>x.session_id===s.original_session_id&&x.student_id===a.student_id);ch=!(o&&o.chargeable)||CFG().makeupDouble}
 audit('ATTENDANCE','attendance',id,a.status,status,'');a.status=status;a.chargeable=ch};
const _vp=BL.voidPayment;BL.voidPayment=function(id,r){if(DB.refunds.some(x=>x.payment_id===id))throw Error('Phiếu đã có hoàn tiền, không thể void');return _vp.call(this,id,r)};
const _cp=BL.calculateTeacherPayroll;BL.calculateTeacherPayroll=function(){_cp.call(this);DB.payrolls.forEach(p=>{if(p.approved_by&&p.appr_net!==p.net_amount&&!closed(p.period)){audit('UNAPPROVE','payroll',p.payroll_id,p.appr_net,p.net_amount,'Số liệu đổi sau khi duyệt');p.approved_by='';p.approved_at=''}})};
BL.approvePayroll=id=>{need('approve');const p=by('payrolls','payroll_id',id);if(p.net_amount<=0)throw Error('Bảng lương chưa có số tiền');p.approved_by=ME.id;p.approved_at=new Date().toISOString();p.appr_net=p.net_amount;audit('APPROVE','payroll',id,null,p.net_amount,'')};
const _pt=BL.payTeacher;BL.payTeacher=function(v){const pr=by('payrolls','payroll_id',v.payroll_id);if(!pr.approved_by)throw Error('Bảng lương chưa được duyệt');return _pt.call(this,v)};
BL.voidTeacherPayment=(id,r)=>{need('fin');const t=by('teacherPayments','payment_id',id);if(closed(t.payment_date.slice(0,7)))throw Error('Kỳ đã khóa');audit('VOID','teacherPayment',id,t.status,'VOID',r);t.status='VOID';DB.ledgerTransactions.filter(x=>x.ref_id===id).forEach(x=>x.status='VOID')};
BL.voidExpense=(id,r)=>{need('approve');const e=by('expenses','expense_id',id);if(closed(e.expense_date.slice(0,7)))throw Error('Kỳ đã khóa');audit('VOID','expense',id,e.status,'VOID',r);e.status='VOID';DB.ledgerTransactions.filter(x=>x.ref_id===id).forEach(x=>x.status='VOID')};
BL.endEnrollment=(eid,date,status,reason)=>{const e=by('enrollments','enrollment_id',eid);e.end_date=date;e.status=status;
 DB.studentSchedules.filter(s=>s.student_id===e.student_id&&s.class_id===e.class_id&&(!s.effective_to||s.effective_to>date)).forEach(s=>s.effective_to=date);
 DB.studentFeeContracts.filter(c=>c.enrollment_id===eid&&(!c.effective_to||c.effective_to>date)).forEach(c=>c.effective_to=date);audit('END_ENROLL','enrollment',eid,'ACTIVE',status,reason)};
const _ic=BL.runIntegrityCheck;BL.runIntegrityCheck=function(){const E=_ic.call(this);
 DB.refunds.forEach(r=>{const p=by('payments','payment_id',r.payment_id);if(!p)E.push('Hoàn tiền '+r.refund_id+' không có phiếu thu');else if(r.amount<=0||BL.paymentRemain(p)<0)E.push('Hoàn tiền vượt phiếu '+p.payment_id)});
 DB.teacherPayments.forEach(t=>{if(!by('payrolls','payroll_id',t.payroll_id))E.push('Trả lương '+t.payment_id+' không có payroll');if(t.status==='ACTIVE'&&DB.ledgerTransactions.filter(x=>x.ref_id===t.payment_id&&x.status==='ACTIVE').length!==1)E.push('Ledger lương '+t.payment_id+' sai')});
 DB.expenses.forEach(e=>{const n=DB.ledgerTransactions.filter(x=>x.ref_id===e.expense_id&&x.status==='ACTIVE').length;if(e.status==='APPROVED'&&n!==1)E.push('Ledger chi phí '+e.expense_id+' sai');if(e.status!=='APPROVED'&&n)E.push('Chi phí '+e.expense_id+' chưa duyệt nhưng đã vào sổ')});
 const un=new Set();DB.users.forEach(u=>{if(un.has(u.username))E.push('Tài khoản trùng: '+u.username);un.add(u.username)});
 DB.enrollments.forEach(e=>{if(!by('students','student_id',e.student_id)||!by('classes','class_id',e.class_id))E.push('Ghi danh '+e.enrollment_id+' sai quan hệ')});
 DB.studentFeeContracts.forEach(c=>{if(!by('enrollments','enrollment_id',c.enrollment_id))E.push('Hợp đồng '+c.fee_contract_id+' không có ghi danh')});
 DB.teacherSalaryContracts.forEach(c=>{if(!by('teachers','teacher_id',c.teacher_id))E.push('Hợp đồng lương '+c.salary_contract_id+' không có giáo viên')});
 return E};

   if(['LEFT','INACTIVE','SUSPENDED','RESERVED'].includes(v.status))DB.enrollments.filter(e=>e.student_id===id&&e.status==='ACTIVE').forEach(e=>BL.endEnrollment(e.enrollment_id,today(),['LEFT','INACTIVE'].includes(v.status)?'ENDED':'PAUSED','Đổi trạng thái '+v.status));

const closeRec=(r,date)=>{r.effective_to=date;if(date<r.effective_from)r.status='VOID'};

 DB.teacherSalaryContracts.push({salary_contract_id:nid('TSC'),teacher_id:tid,assignment_id:a.assignment_id,salary_type:v.salary_type,rate:v.rate,fixed:v.fixed||0,effective_from:v.from,effective_to:'',bonus_rule:'',deduction_rule:'',status:'ACTIVE'})};
A._tsch=(tid,cid,v)=>{const days=V.days(v.days);V.time(v.st,v.et);DB.teacherSchedules.filter(s=>s.teacher_id===tid&&s.class_id===cid&&s.status==='ACTIVE'&&!s.effective_to).forEach(s=>closeRec(s,addDays(v.from,-1)));
 DB.teachingSessions=DB.teachingSessions.filter(s=>!(s.status==='SCHEDULED'&&s.scheduled_teacher_id===tid&&s.class_id===cid&&s.date>=v.from&&!s.note&&!DB.attendance.some(a=>a.session_id===s.session_id)));

 const opts=[['','Tất cả buổi học'],...DB.classes.map(c=>['c:'+c.class_id,'Lớp: '+c.class_name]),...DB.teachers.filter(t=>!myT()||t.teacher_id===myT()).map(t=>['t:'+t.teacher_id,'GV: '+t.full_name]),...(myT()?[]:DB.students.map(s=>['s:'+s.student_id,'HS: '+s.full_name]))];
 const col=days.map(dt=>{let ev=[];
  if(k==='s'){ev=DB.studentSchedules.filter(x=>x.student_id===v&&x.status==='ACTIVE'&&+x.weekday===wd(D(dt))&&x.effective_from<=dt&&(!x.effective_to||x.effective_to>=dt)).map(x=>[x.start_time,cName(x.class_id)+' (lịch riêng)'])}
  else ev=DB.teachingSessions.filter(s=>s.date===dt&&(!k||(k==='c'&&s.class_id===v)||(k==='t'&&(s.actual_teacher_id===v||s.scheduled_teacher_id===v)))&&(!myT()||s.actual_teacher_id===myT()||s.scheduled_teacher_id===myT())).map(s=>[s.start_time,`${cName(s.class_id)} · ${tName(s.actual_teacher_id)} ${s.status!=='SCHEDULED'?'['+s.status+']':''}`]);
  return`<div><b>${wd(D(dt))==8?'CN':'Thứ '+wd(D(dt))} ${dt.slice(8)}/${dt.slice(5,7)}</b>${ev.sort().map(e=>`<div class="ev">${e[0]} ${esc(e[1])}</div>`).join('')||'<span class="mute">—</span>'}</div>`}).join('');
 return`<h2>Thời khóa biểu tuần</h2><div class="bar"><button onclick="UI.wk--;render()">‹ Tuần trước</button><button onclick="UI.wk=0;render()">Tuần này</button><button onclick="UI.wk++;render()">Tuần sau ›</button><select onchange="UI.cf=this.value;render()">${opt(opts,UI.cf)}</select></div><div class="cal">${col}</div>`};

 $('#p_alc').innerHTML=iv.length?tbl(['Kỳ','Hạn','Còn nợ','Phân bổ'],iv.map(i=>[i.billing_period,i.due_date,money(BL.calculateInvoiceBalance(i)),`<input type="number" data-inv="${i.invoice_id}" style="width:130px">`])):'<span class="mute">Không có khoản nợ — toàn bộ sẽ thành credit cho kỳ sau.</span>'};
A.pay=sid=>{$('#modal').innerHTML=`<div class="mb" onclick="if(event.target===this)closeM()"><div class="md"><h3>Thu tiền học phí</h3><div class="fg"><div><label>Học sinh</label><select id="p_s" onchange="A._alc()">${opt([['','—'],...DB.students.map(s=>[s.student_id,s.full_name])],sid||'')}</select></div><div><label>Số tiền</label><input id="p_a" type="number" value="0"></div><div><label>Ngày</label><input id="p_d" type="date" value="${today()}"></div><div><label>Hình thức</label><select id="p_m">${opt(['CASH','BANK_TRANSFER','QR','OTHER'])}</select></div><div><label>Vào tài khoản</label><select id="p_c">${opt(DB.accounts.map(a=>[a.account_id,a.name]))}</select></div><div><label>Ghi chú</label><input id="p_n"></div></div><h3>Phân bổ thủ công (bỏ trống = tự động, nợ cũ nhất trước)</h3><div id="p_alc"></div><div class="ar"><button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="okb">Lưu phiếu thu</button></div></div></div>`;A._alc();
 $('#okb').onclick=()=>run(()=>{const v={student_id:$('#p_s').value,total_amount:+$('#p_a').value||0,payment_date:$('#p_d').value,payment_method:$('#p_m').value,account_id:$('#p_c').value,note:$('#p_n').value,invoice_id:'AUTO'};
  if(!v.student_id)throw Error('Hãy chọn học sinh');if(!(v.total_amount>0))throw Error('Số tiền phải lớn hơn 0');if(!okDate(v.payment_date))throw Error('Ngày thu không hợp lệ');if(v.payment_date>today())throw Error('Ngày thu không được ở tương lai');if(v.note.trim().length>200)throw Error('Ghi chú quá dài');v.note=v.note.trim();
  const man=[...document.querySelectorAll('#p_alc input')].map(x=>[x.dataset.inv,+x.value||0]).filter(x=>x[1]>0);if(man.reduce((s,x)=>s+x[1],0)>v.total_amount)throw Error('Tổng phân bổ vượt số tiền thu');
  man.forEach(([iv])=>{const i=by('invoices','invoice_id',iv);if(!i||i.student_id!==v.student_id)throw Error('Hóa đơn không thuộc học sinh này')});
  BL.addPayment(v);const p=DB.payments[DB.payments.length-1];man.forEach(([iv,amt])=>{const i=by('invoices','invoice_id',iv),a=Math.min(amt,BL.calculateInvoiceBalance(i));if(a>0)DB.paymentAllocations.push({allocation_id:nid('ALC'),payment_id:p.payment_id,invoice_id:iv,amount:a,auto:false})});closeM()},'Đã lập phiếu thu')};
A.refund=id=>{const p=by('payments','payment_id',id),rem=BL.paymentRemain(p);form('Hoàn tiền · tối đa '+money(rem)+' (phần chưa phân bổ / credit)',[F('amount','Số tiền','number',rem),F('date','Ngày','date',today()),F('account_id','Chi từ tài khoản','select',p.account_id,{o:DB.accounts.map(a=>[a.account_id,a.name])}),F('reason','Lý do','text','',{r:1,w:1})],v=>{need('approve');V.pos(v.amount,'Số tiền');if(v.amount>rem)throw Error('Chỉ hoàn được phần chưa phân bổ. Muốn hoàn phần đã dùng, hãy void phiếu thu rồi lập lại.');if(closed(v.date.slice(0,7)))throw Error('Kỳ đã khóa');
  const r={refund_id:nid('RFD'),payment_id:id,amount:v.amount,reason:v.reason,approved_by:ME.id,date:v.date,account_id:v.account_id};DB.refunds.push(r);
  DB.ledgerTransactions.push({txn_id:nid('TXN'),date:v.date,type:'REFUND_OUT',account_id:v.account_id,amount:-v.amount,ref_type:'refund',ref_id:r.refund_id,status:'ACTIVE'});audit('REFUND','refund',r.refund_id,null,r,v.reason)})};
function printHTML(title,body){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.append(f);const d=f.contentWindow.document;d.open();d.write(`<html><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px Arial;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:6px;text-align:left}h2,h3{margin:4px 0}</style></head><body>${body}<\/body></html>`);d.close();setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),3000)},250)}
A.printReceipt=id=>{const p=by('payments','payment_id',id),al=DB.paymentAllocations.filter(a=>a.payment_id===id);printHTML(p.receipt_number,`<h2>${esc(CFG().center)}</h2><h3>PHIẾU THU ${p.receipt_number}</h3><p>Ngày: ${p.payment_date}<br>Học sinh: ${esc(sName(p.student_id))}<br>Hình thức: ${p.payment_method}<br>Trạng thái: ${p.status}</p><table><tr><th>Khoản</th><th>Số tiền</th></tr>${al.map(a=>`<tr><td>Học phí kỳ ${by('invoices','invoice_id',a.invoice_id)?.billing_period||''}</td><td>${money(a.amount)}</td></tr>`).join('')}<tr><th>Tổng thu</th><th>${money(p.total_amount)}</th></tr></table>`)};
A.printPayslip=id=>{const p=by('payrolls','payroll_id',id);printHTML('Phiếu lương',`<h2>${esc(CFG().center)}</h2><h3>PHIẾU LƯƠNG ${p.period} · ${esc(tName(p.teacher_id))}</h3><table><tr><th>Lớp</th><th>Nội dung</th><th>Mức</th><th>SL</th><th>Thành tiền</th></tr>${DB.payrollItems.filter(i=>i.payroll_id===id).map(i=>`<tr><td>${esc(cName(i.class_id))}</td><td>${i.note}</td><td>${money(i.rate)}</td><td>${+(+i.quantity).toFixed(2)}</td><td>${money(i.amount)}</td></tr>`).join('')}</table><p>Gross: ${money(p.gross_amount)}<br>+ Thưởng: ${money(p.bonus)}<br>− Khấu trừ: ${money(p.deduction)}<br>− Tạm ứng: ${money(p.advance)}<br><b>Thực nhận: ${money(p.net_amount)}</b><br>Đã trả: ${money(BL.teacherPaid(id))} · Còn: ${money(BL.calculateTeacherBalance(p))}</p>`)};
P.pay=()=>{const mt=myT(),fin=can('fin'),ap=can('approve');return`<h2>Lương giáo viên</h2><p class="mute">Payroll tự tính từ buổi dạy thực tế × mức lương riêng của từng giáo viên theo lớp. NET = Gross + Thưởng − Khấu trừ − Tạm ứng. Cần duyệt trước khi trả.</p>${fin?`<div class="bar"><button onclick="A.adj('advance')">+ Tạm ứng</button><button onclick="A.adj('bonus')">+ Thưởng</button><button onclick="A.adj('deduction')">+ Khấu trừ</button></div>`:''}${tbl(['Giáo viên','Kỳ','Gross','Thưởng','Khấu trừ','Tạm ứng','Thực nhận','Đã trả','Còn trả','TT','Duyệt',''],[...DB.payrolls].filter(p=>!mt||p.teacher_id===mt).sort((a,b)=>b.period.localeCompare(a.period)).map(p=>[esc(tName(p.teacher_id)),p.period,money(p.gross_amount),money(p.bonus),money(p.deduction),money(p.advance),`<b>${money(p.net_amount)}</b>`,money(BL.teacherPaid(p.payroll_id)),`<b>${money(BL.calculateTeacherBalance(p))}</b>`,badge(p.status),p.approved_by?'✓':ap?ibtn('Duyệt',`run(()=>BL.approvePayroll('${p.payroll_id}'),'Đã duyệt')`):'chờ',ibtn('Chi tiết',`A.payItems('${p.payroll_id}')`)+ibtn('In',`A.printPayslip('${p.payroll_id}')`)+(fin&&p.approved_by?ibtn('Trả lương',`A.payT('${p.payroll_id}')`):'')]))}`};

A.ledgerAdd=kind=>form(kind==='IN'?'Thu khác':'Điều chỉnh sổ (+ tăng, − giảm)',[F('date','Ngày','date',today()),F('account_id','Tài khoản','select','CASH',{o:DB.accounts.map(a=>[a.account_id,a.name])}),F('amount','Số tiền','number',0),F('reason','Lý do','text','',{r:1,w:1})],v=>{need(kind==='IN'?'fin':'approve');if(!v.amount)throw Error('Số tiền khác 0');if(kind==='IN')V.pos(v.amount,'Số tiền');if(closed(v.date.slice(0,7)))throw Error('Kỳ đã khóa');
  const id=nid('MAN');DB.ledgerTransactions.push({txn_id:nid('TXN'),date:v.date,type:kind==='IN'?'OTHER_IN':'ADJUSTMENT',account_id:v.account_id,amount:v.amount,ref_type:'manual',ref_id:id,status:'ACTIVE',reason:v.reason});audit('LEDGER','ledger',id,null,v,v.reason)});
A.voidExp=id=>{const r=prompt('Lý do void khoản chi?');if(r)run(()=>BL.voidExpense(id,r),'Đã void')};
A.voidTxn=id=>{const r=prompt('Lý do void giao dịch?');if(r)run(()=>{need('approve');const t=by('ledgerTransactions','txn_id',id);if(t.ref_type!=='manual')throw Error('Chỉ void được giao dịch nhập tay; giao dịch khác hãy void ở nguồn');if(closed(t.date.slice(0,7)))throw Error('Kỳ đã khóa');audit('VOID','ledger',id,t.status,'VOID',r);t.status='VOID'},'Đã void')};
P.fin=()=>{const acc=DB.accounts.map(a=>`<div class="gl k"><small>${esc(a.name)}</small><b>${money(BL.calculateAccountBalance(a))}</b><div class="s">Đầu kỳ ${money(a.opening)}</div></div>`).join('');
 return`<h2>Thu chi & sổ giao dịch</h2><div class="grid">${acc}</div><div class="bar"><button class="pri" onclick="A.exp()">+ Khoản chi</button><button onclick="A.ledgerAdd('IN')">+ Thu khác</button><button onclick="A.ledgerAdd('ADJ')">± Điều chỉnh sổ</button><button onclick="A.acc()">+ Tài khoản</button></div><h3>Chi phí</h3>${tbl(['Ngày','Loại','Mô tả','Số tiền','Tài khoản','TT',''],[...DB.expenses].reverse().map(e=>[e.expense_date,e.category_id,esc(e.description),`<span class=r>${money(e.amount)}</span>`,e.account_id,badge(e.status),(e.status==='PENDING'&&can('approve')?ibtn('Duyệt',`A.appr('${e.expense_id}')`):'')+(e.status!=='VOID'&&can('approve')?ibtn('Void',`A.voidExp('${e.expense_id}')`):'')]))}<h3>Sổ giao dịch (ledger)</h3>${tbl(['Ngày','Loại','Tài khoản','Số tiền','Tham chiếu','TT',''],[...DB.ledgerTransactions].reverse().slice(0,100).map(t=>[t.date,t.type,t.account_id,`<span class=r style="color:${t.amount<0?'var(--bad)':'var(--ok)'}">${money(t.amount)}</span>`,t.ref_id+(t.reason?' · '+esc(t.reason):''),badge(t.status),t.ref_type==='manual'&&t.status==='ACTIVE'&&can('approve')?ibtn('Void',`A.voidTxn('${t.txn_id}')`):'']))}`};

P.rep=()=>{const t=UI.rt,T=[['per','Theo kỳ'],['cls','Theo lớp'],['tea','Theo giáo viên'],['age','Tuổi nợ']];let c='';
 if(t==='per')c=tbl(['Kỳ','Phải thu','Đã thu (theo HĐ)','Công nợ','Tiền vào','Chi lương','Chi phí','Dòng tiền ròng'],BL.report().map(r=>[r.p,money(r.due),money(r.paid),money(r.debt),money(r.cin),money(r.sal),money(r.exp),`<b>${money(r.cin-r.sal-r.exp)}</b>`]))+'<p class="mute">Phải thu, đã thu, công nợ và tiền thực có là bốn khái niệm tách biệt; tiền thực có chỉ lấy từ sổ giao dịch.</p>';
 if(t==='cls')c=tbl(['Lớp','HS đang học','Phải thu','Đã thu','Công nợ','Buổi đã dạy','Chi lương lớp','Chênh lệch (thu − lương)'],DB.classes.map(cl=>{const iv=DB.invoices.filter(i=>by('enrollments','enrollment_id',i.enrollment_id)?.class_id===cl.class_id&&!['CANCELLED','WAIVED'].includes(i.status)),due=iv.reduce((s,i)=>s+BL.net(i),0),paid=iv.reduce((s,i)=>s+BL.allocOf(i),0),sal=DB.payrollItems.filter(i=>i.class_id===cl.class_id).reduce((s,i)=>s+i.amount,0);
  return[esc(cl.class_name),DB.enrollments.filter(e=>e.class_id===cl.class_id&&e.status==='ACTIVE').length,money(due),money(paid),money(due-paid),DB.teachingSessions.filter(s=>s.class_id===cl.class_id&&s.status==='COMPLETED').length,money(sal),`<b>${money(paid-sal)}</b>`]}));
 if(t==='tea')c=tbl(['Giáo viên','Buổi đã dạy','Dạy thay','Lương thực nhận','Đã trả','Còn phải trả'],DB.teachers.map(x=>{const pr=DB.payrolls.filter(p=>p.teacher_id===x.teacher_id);return[esc(x.full_name),DB.teachingSessions.filter(s=>s.actual_teacher_id===x.teacher_id&&BL.paid(s)>0).length,DB.teachingSessions.filter(s=>s.actual_teacher_id===x.teacher_id&&s.scheduled_teacher_id!==x.teacher_id).length,money(pr.reduce((s,p)=>s+p.net_amount,0)),money(pr.reduce((s,p)=>s+BL.teacherPaid(p.payroll_id),0)),money(pr.reduce((s,p)=>s+BL.calculateTeacherBalance(p),0))]}));
 if(t==='age'){const b=['Chưa đến hạn','1–30 ngày','31–60 ngày','61–90 ngày','> 90 ngày'],idx=d=>d<=0?0:d<=30?1:d<=60?2:d<=90?3:4,tot=[0,0,0,0,0];
  const rows=DB.students.map(s=>{const r=[0,0,0,0,0];DB.invoices.filter(i=>i.student_id===s.student_id).forEach(i=>{const bal=BL.calculateInvoiceBalance(i);if(bal>0){const k=idx(Math.floor((D(today())-D(i.due_date))/864e5));r[k]+=bal;tot[k]+=bal}});return[s.full_name,r]}).filter(x=>x[1].some(v=>v));
  c=tbl(['Học sinh',...b,'Tổng'],[...rows.map(([n,r])=>[esc(n),...r.map(money),`<b>${money(r.reduce((a,b)=>a+b,0))}</b>`]),['<b>TỔNG</b>',...tot.map(x=>`<b>${money(x)}</b>`),`<b>${money(tot.reduce((a,b)=>a+b,0))}</b>`]])}
